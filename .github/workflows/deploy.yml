name: Deploy to SV Cloud

# Managed by SV Cloud. Do NOT edit this file — the SV Cloud API re-validates
# your framework at deploy time, and changes here will break or lock out deploys.

on:
  push:
    branches: [main]

# OIDC: lets this job mint a short-lived token GitHub signs and the SV Cloud
# API verifies. Removing `id-token: write` breaks authentication — leave it.
permissions:
  id-token: write
  contents: read

concurrency:
  group: cloud-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v5 of these actions runs on the runner's Node 24; the v4 releases target
      # Node 20, which GitHub deprecated and now force-runs on 24 with a warning.
      #
      # lfs is deliberately FALSE: design/assets/ checks out as small LFS
      # pointer text, and the sync step below pulls the real bytes for the few
      # files a commit actually touched. Pulling them all here is what made a
      # media-heavy repo pay for its entire asset folder on every push.
      #
      # fetch-depth: 0 gives that step the history it needs to diff against the
      # commit whose assets are already uploaded. With a shallow clone that
      # commit is usually absent, and every build falls back to a full sync.
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      # Uses setup-node with npm caching enabled against the starter package-lock.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fast local guard before burning build minutes. The SV Cloud API re-checks
      # this server-side at deploy time at the attested commit SHA — this step
      # is only quick feedback, not the security boundary.
      - name: Verify framework dependency
        run: |
          node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};if(!d['hono']){console.error('::error::Missing required dependency hono');process.exit(1)}"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Gates before the build: a type error or a failing test stops the deploy
      # rather than shipping a broken site. Fix the code, don't skip the test.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches a stale src/assets.ts (forgot to run `npm run assets`) or an
      # oversized/unsupported file in design/assets/ before anything uploads.
      - name: Check design assets
        run: npm run assets:check

      # --dry-run bundles the Worker WITHOUT deploying it, so no hosting
      # credentials are ever present on this runner. SV Cloud pushes the artifact.
      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist

      # Uploads design/assets/ BEFORE the app goes live, so the deployed app
      # never references an object that isn't there yet. Same OIDC token as the
      # deploy step below, minted fresh here since each step is a new shell.
      #
      # Only what CHANGED is uploaded. SV Cloud remembers the last commit whose
      # assets reached storage; this step diffs against it, fetches LFS bytes
      # for that file list alone, uploads it, and records the new commit. A
      # push that touches no media does no work at all.
      #
      # It falls back to uploading everything when there is nothing to diff
      # against — a first deploy, or a recorded commit that is no longer in
      # this repo's history after a force push. Put [resync-assets] in a commit
      # message to force that same full pass, which is the fix if an object is
      # ever removed from storage behind the platform's back.
      #
      # Files DELETED from design/assets/ are left in storage on purpose: your
      # app stops referencing them, and nothing this step could delete is worth
      # the risk of deleting something a running app still serves.
      - name: Sync design assets
        env:
          CLOUD_API_URL: "https://api.cloud.sv-academy.org"
        run: |
          set -euo pipefail
          if [ ! -d design/assets ]; then exit 0; fi

          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CLOUD_API_URL" | jq -r '.value')

          BASE=$(curl -sSf -H "Authorization: Bearer $OIDC" \
            "$CLOUD_API_URL/api/v1/projects/deploy/assets/base" | jq -r '.base_sha // empty')

          # An unusable base is not an error — it just means a full pass.
          if git log -1 --pretty=%B | grep -qF '[resync-assets]'; then
            echo "[resync-assets] in the commit message — uploading everything."
            BASE=""
          elif [ -n "$BASE" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Last synced commit $BASE is not in this history — uploading everything."
            BASE=""
          fi

          # git prints the CHANGED paths (renames as their new name); with no
          # base, every tracked file. Dotfiles are tooling, not assets, and are
          # skipped here for the same reason scripts/assets-manifest.mjs skips
          # them.
          if [ -n "$BASE" ]; then
            echo "Changed since $BASE:"
            CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE" HEAD -- design/assets)
          else
            CHANGED=$(git ls-files -- design/assets)
          fi
          # A file of paths rather than a shell array: `set -u` and empty
          # arrays disagree across bash versions, and this stays readable.
          LIST=$(mktemp)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$(basename "$f")" in .*|Thumbs.db) continue ;; esac
            [ -f "$f" ] || continue
            printf '%s\n' "$f" >> "$LIST"
          done <<< "$CHANGED"
          COUNT=$(wc -l < "$LIST" | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "No design assets changed — nothing to upload."
          else
            echo "$COUNT file(s) to upload."

            # The checkout left LFS pointers, so fetch the real bytes for
            # exactly this list. --include takes a comma-separated set, so a
            # path containing a comma (legal, if unusual) is pulled on its own.
            #
            # Guarded on git-lfs existing at all: a repo whose owner never
            # installed it has ordinary files here, already checked out, and
            # must not fail the build over a tool it does not use.
            if command -v git-lfs > /dev/null 2>&1; then
              INCLUDE=""
              while IFS= read -r f; do
                case "$f" in
                  *,*) git lfs pull --include="$f" ;;
                  *) INCLUDE="${INCLUDE:+$INCLUDE,}$f" ;;
                esac
              done < "$LIST"
              if [ -n "$INCLUDE" ]; then git lfs pull --include="$INCLUDE"; fi
            fi

            while IFS= read -r f; do
              REL="${f#design/assets/}"
              TYPE=$(file -b --mime-type "$f")
              # The size is signed INTO the upload URL, so it is a real ceiling
              # rather than something we merely claim. Sending any other number
              # of bytes is refused by storage before one is written.
              SIZE=$(wc -c < "$f" | tr -d ' ')
              echo "  uploading $REL ($SIZE bytes)"
              URL=$(curl -sSf -G -H "Authorization: Bearer $OIDC" \
                --data-urlencode "path=$REL" \
                --data-urlencode "content_length=$SIZE" \
                --data-urlencode "content_type=$TYPE" \
                "$CLOUD_API_URL/api/v1/projects/deploy/assets/upload-url" | jq -r '.url')
              curl -sSf -X PUT --upload-file "$f" -H "content-type: $TYPE" "$URL"
            done < "$LIST"
          fi
          rm -f "$LIST"

          # Recorded once every upload above has succeeded — `set -e` means a
          # failed one never reaches this line, so the next run retries it.
          curl -sSf -X POST -H "Authorization: Bearer $OIDC" \
            "$CLOUD_API_URL/api/v1/projects/deploy/assets/synced" > /dev/null

      # All in one step so the OIDC token never leaves the runner step.
      #
      # wrangler's dry-run bundle is the Worker's WHOLE module graph, not just
      # its entry point: any non-JS import (a built client's "./index.html",
      # most commonly) lands as a sibling file directly in dist/ that
      # index.js imports by name — every one of them has to reach SV Cloud, or
      # the script upload fails outright with a "no such module" error. dist/
      # can also hold files that are NOT part of that graph (wrangler's own
      # dry-run output copies a stray README.md in there, for one) — rather
      # than guess which stray files are safe to skip, read index.js's own
      # relative import specifiers and upload exactly that set, nothing more.
      - name: Deploy to SV Cloud
        env:
          CLOUD_API_URL: "https://api.cloud.sv-academy.org"
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CLOUD_API_URL" | jq -r '.value')
          MODULES=$(node -e '
          const fs = require("fs");
          const src = fs.readFileSync("dist/index.js", "utf8");
          const names = new Set(["index.js"]);
          for (const m of src.matchAll(/from "\.\/([^"]+)"/g)) names.add(m[1]);
          process.stdout.write([...names].join("\n"));
          ')
          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue
            URL=$(curl -sSf -G -H "Authorization: Bearer $OIDC" \
              --data-urlencode "path=$NAME" \
              "$CLOUD_API_URL/api/v1/projects/deploy/upload-url" | jq -r '.url')
            curl -sSf -X PUT --upload-file "dist/$NAME" \
              -H "content-type: application/octet-stream" "$URL"
          done <<< "$MODULES"
          curl -sSf -X POST \
            -H "Authorization: Bearer $OIDC" \
            -H "content-type: application/json" \
            "$CLOUD_API_URL/api/v1/projects/deploy"
